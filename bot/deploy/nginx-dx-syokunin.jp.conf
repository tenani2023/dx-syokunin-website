# /etc/nginx/sites-available/dx-syokunin.jp → sites-enabled にシンボリックリンク
# サイト本体は VPS 上のリポジトリ(静的ファイル)を直接配信。/webhook と /deploy だけボットへ。
# HTTPS は certbot --nginx -d dx-syokunin.jp が追記する。

server {
    listen 80;
    listen [::]:80;
    server_name dx-syokunin.jp www.dx-syokunin.jp;

    root /srv/dx-syokunin-website;
    index index.html;
    charset utf-8;

    # 公開しないもの
    location ~ ^/(bot|tools|node_modules|_products|\.git|\.github)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location ~ ^/(package(-lock)?\.json|site\.config\.json|README\.md)$ { return 404; }
    location ^~ /column/posts/ { return 404; }   # Markdown 原稿

    # LINE Webhook / GitHub Webhook → ボット
    location = /webhook { proxy_pass http://127.0.0.1:3200; include /etc/nginx/snippets/dx-syokunin-proxy.conf; }
    location = /deploy  { proxy_pass http://127.0.0.1:3200; include /etc/nginx/snippets/dx-syokunin-proxy.conf; }

    gzip on;
    gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;
    gzip_min_length 1024;

    # 画像・CSS・JS は長めにキャッシュ(CSS/JS は ?v= で更新)
    location ~* \.(jpe?g|png|webp|svg|ico|woff2?)$ { expires 30d; add_header Cache-Control "public"; access_log off; }
    location ~* \.(css|js)$ { expires 7d; add_header Cache-Control "public"; }

    # HTML は毎回確認(記事の更新をすぐ反映)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
}
