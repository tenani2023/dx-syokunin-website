# コラムの自動ビルド: column/posts や画像が変わったら HTML・一覧・sitemap を生成してコミットする
name: build-column

on:
  push:
    branches: [main]
    paths:
      - "column/posts/**"
      - "assets/column/**"
      - "site.config.json"
      - "tools/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-column
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: commit generated files
        run: |
          git config user.name "dx-syokunin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add column sitemap.xml
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "コラムを再生成 [skip ci]"
          git push
